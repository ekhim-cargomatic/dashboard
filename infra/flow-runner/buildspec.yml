version: 0.2

# Walk one point of the flow map in a browser, and publish the result where the
# dashboard reads it.
#
# The suite arrives as a zip in a private bucket, uploaded from a workstation by
# `deploy-flow-fn.sh --push-tests`. CodeBuild extracts it into $CODEBUILD_SRC_DIR
# before this runs, so there is no clone and no git credential anywhere in the
# system.
#
# This does not run behave and reads no feature files. The plan — which page,
# which selector, which gesture, in which order — was resolved by the Lambda
# from the flow map and left in S3; run_plan.py performs it. The map is the
# script, which is the whole point: pressing play on a step runs that step, not
# whatever tests happen to share a tag with it.
#
#   FLOW_PLAN_BUCKET / FLOW_PLAN_KEY  where the resolved plan is
#   FLOW_ENV     staging | dev                            (never prod)
#   FLOW_TARGET  the node pressed, recorded for traceability
#   FLOW_CHUNK   the chunk it belongs to
#   DASHBOARD_BUCKET  where the report goes
#
# Credentials come from configs/<env>.yaml inside that payload, plus the .env
# beside it for the password placeholders — the same two files the Playwright
# suite reads. Nothing is passed in from the caller, so the public endpoint
# cannot influence who the browser signs in as.
#
# A failing step does NOT fail the build. The build answers "did the run
# complete", and qa-summary.json answers "did it pass" — conflating them would
# mean a red build whenever the map correctly caught a regression, and would
# leave the UI unable to tell a broken runner from a broken product.

env:
  # Returned by BatchGetBuilds, which is how the Lambda tells the dashboard
  # exactly which run to load instead of making it guess from the listing.
  exported-variables:
    - RUN_PREFIX
  variables:
    FLOW_ENV: staging

phases:
  pre_build:
    commands:
      - echo "Target $FLOW_TARGET · chunk $FLOW_CHUNK · env $FLOW_ENV"
      - cd "$CODEBUILD_SRC_DIR"
      - test -f requirements.txt || { echo "payload is not a playwright-automation tree"; exit 1; }
      - test -f "configs/${FLOW_ENV}.yaml" || { echo "payload has no config for ${FLOW_ENV}"; exit 1; }
      # Not fatal on its own: roles whose password is a literal in configs still
      # work. It fails loudly later if a placeholder has no value, and this line
      # is what makes that failure legible.
      #
      # Block scalar, not a plain one: YAML reads ": " inside a plain scalar as
      # a mapping indicator no matter what shell quoting is around it, and
      # CodeBuild rejects the whole buildspec with a YAML_FILE_ERROR.
      - |
        test -f .env || echo "warning - no .env in the payload, roles with placeholder passwords will fail"
      # The plan and the runner both travel outside the image, so changing
      # either takes effect on the next deploy rather than on an image rebuild.
      - aws s3 cp "s3://${FLOW_PLAN_BUCKET}/${FLOW_PLAN_KEY}" plan.json --only-show-errors
      - aws s3 cp "s3://${FLOW_PLAN_BUCKET}/flow/run_plan.py" run_plan.py --only-show-errors
      - pip install --quiet --no-cache-dir -r requirements.txt
      # A no-op when requirements pins the version the image baked; a real
      # download when it has moved on. Cheaper than being wrong.
      - playwright install chromium

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - rm -rf reports/allure-results && mkdir -p reports/allure-results
      - |
        set +e
        python run_plan.py \
          --plan plan.json \
          --repo . \
          --env "$FLOW_ENV" \
          --results reports/allure-results \
          --screenshots reports/screenshots
        echo "runner exited $?"
        set -e

  post_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      # Runs even when the build phase failed, which is the point: a run that
      # stopped partway still has a result worth looking at.
      - allure generate reports/allure-results -o reports/allure-report --clean
      - |
        node /opt/qa/qa-summary.mjs \
          --results reports/allure-results \
          --out reports/allure-report/qa-summary.json \
          --domain-map /opt/qa/domains.generated.json \
          --workflow "Flow run" \
          --run-number "$CODEBUILD_BUILD_NUMBER" \
          --environment "$FLOW_ENV" \
          --trigger "flow:${FLOW_TARGET}" \
          --actor "qa-dashboard"
      # --only-show-errors on the sync, not just --no-progress: sync prints a
      # line per file, and that would bury the step results in the streamed log.
      # Comments stay out of the block below — CodeBuild echoes those lines.
      #
      # One suite folder for every flow run, not one per target. The target
      # lives in the summary's `trigger` instead. Read the prefix back out of
      # the file rather than recomputing it: the key embeds a timestamp that
      # would drift.
      - |
        export RUN_PREFIX=$(node -e "process.stdout.write(require('$CODEBUILD_SRC_DIR/reports/allure-report/qa-summary.json').prefix)")
        echo "publishing to s3://${DASHBOARD_BUCKET}/${RUN_PREFIX}/"
        aws s3 sync reports/allure-report "s3://${DASHBOARD_BUCKET}/${RUN_PREFIX}/" --delete --only-show-errors
        echo "published $(find reports/allure-report -type f | wc -l | tr -d ' ') files"
