# The grid itself: Chrome slots and Android slots on one host.
#
# Two things make this different from the CodeBuild runner, and both come from
# the same place — a CodeBuild container has no inbound network, so it can only
# ever push frames out. A long-lived host can be *connected to*, which buys:
#
#   - a WebDriver endpoint, so playwright-automation can drive these browsers
#     with no code change (SELENIUM_REMOTE_URL=http://<host>:4444)
#   - noVNC per slot, which is a real interactive session rather than a picture
#     of one: you can click and type into a run while it is happening
#
# Ports are deliberately one-per-slot rather than one shared view. A single
# standalone container with SE_NODE_MAX_SESSIONS would be fewer moving parts,
# but every session would share one screen, and watching four runs overlap on
# one desktop is worse than not watching at all.
#
#   4444          Selenium hub — the only port the test suite needs
#   7901..7904    noVNC, one per Chrome slot
#   4723..4724    Appium, one per Android slot
#   6081..6082    noVNC, one per Android slot
#
# Sizing is for a c8i.4xlarge (16 vCPU / 32 GiB). Four Chrome slots at ~2 GiB
# and two Android slots at ~4 GiB leaves real headroom; the emulators are what
# run out first, which is why there are two of them and not four.

name: qa-grid

x-chrome-node: &chrome-node
  image: selenium/node-chromium:4.27.0
  depends_on: [hub]
  environment: &chrome-env
    SE_EVENT_BUS_HOST: hub
    SE_EVENT_BUS_PUBLISH_PORT: 4442
    SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
    # One session per node. The whole point of a slot is that it owns its
    # screen — a second session on the same node would share the noVNC view
    # with the first.
    SE_NODE_MAX_SESSIONS: 1
    SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    SE_START_XVFB: "true"
    # Chromium writes to /dev/shm and the Docker default of 64MB is not enough
    # for a real page; the alternative is --disable-dev-shm-usage, which trades
    # the crash for being slow.
    SE_VNC_PASSWORD: ${GRID_VNC_PASSWORD:?set GRID_VNC_PASSWORD}
  shm_size: 2gb
  restart: unless-stopped

services:
  # WHY THE NODES ARE TOLD THE PUBLIC ADDRESS AND NOT http://hub:4444
  #
  # Playwright does not speak WebDriver to a Chrome it is given - it speaks CDP.
  # It asks the grid for a session, and the grid replies with an `se:cdp`
  # WebSocket to connect to. That URL is built from SE_NODE_GRID_URL, so with
  # the compose-internal hostname the reply is ws://hub:4444/session/<id>/se/cdp
  # and the client dies on `getaddrinfo ENOTFOUND hub`: the session is created,
  # a slot is burned, and the run never starts. The node needs to advertise an
  # address the CLIENT can reach, which is the instance's public IP.
  #
  # deploy-grid.sh push writes GRID_PUBLIC_URL into .env from whatever address
  # the instance currently has. That address changes on every stop/start, so
  # push is re-run after each `up` rather than only when the compose file
  # changes.

  # ----------------------------------------------------------------- tls --
  # The only service published on 80/443. Everything else keeps its own port
  # for direct use from an allowlisted machine; this is what lets the DEPLOYED
  # dashboard, which is https, talk to the grid at all. See grid/Caddyfile.
  caddy:
    image: caddy:2.8-alpine
    container_name: qa-grid-caddy
    # PARKED. Not started by anything that does not ask for it by name:
    #
    #   docker compose --profile tls up -d
    #
    # It is here because the work was done, not because it is wanted. The grid
    # admits ONE address, so serving it over TLS from the deployed dashboard
    # would let exactly one person -- the one who can already open
    # localhost:5173 -- reach it from a nicer URL, in exchange for a record in
    # a production DNS zone, port 80 open to the world, and certificate
    # renewal as a new way to break. If the allowlist is ever widened to a VPN
    # or office range, this becomes worth switching on; until then it costs
    # more than it returns.
    #
    # A profile rather than a comment because the alternative, GRID_DOMAIN as
    # a required variable, meant every `push` failed until someone set a
    # domain they had decided not to use.
    profiles: ["tls"]
    depends_on: [hub]
    ports:
      - "80:80"     # ACME challenge only, and must be open to the world for it
      - "443:443"
    environment:
      GRID_DOMAIN: ${GRID_DOMAIN:-qa-grid.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive a recreate. Without this every `push` would ask
      # Let's Encrypt for a new one and walk into the five-per-week limit.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # ------------------------------------------------------------------ hub --
  # The one address the suite talks to. Playwright reads SELENIUM_REMOTE_URL
  # and launches Chrome *through* here, so features/environment.py keeps
  # calling browser_type.launch() and never learns it went remote.
  hub:
    image: selenium/hub:4.27.0
    container_name: qa-grid-hub
    ports:
      - "4444:4444"   # WebDriver — this is the URL playwright-automation wants
      - "4442:4442"
      - "4443:4443"
    environment:
      # The dashboard's Grid tab reads /status with fetch() from localhost:5173,
      # which is a cross-origin request. Without this the browser blocks the
      # response and the tab reports a healthy grid as unreachable - while the
      # noVNC tiles beside it work perfectly, because an iframe is not subject
      # to CORS. Confusing enough to be worth the one line.
      # --allow-cors, passed through SE_OPTS rather than as SE_ENABLE_CORS.
      # This image accepts the SE_ENABLE_CORS variable without complaint and
      # then ignores it: `printenv` shows it set while the server never gets
      # the flag, so /status comes back with no Access-Control-Allow-Origin and
      # the tab reports a healthy grid as unreachable. `hub --help` lists the
      # real option; SE_OPTS is how the image forwards one.
      SE_OPTS: "--allow-cors true"
      # A grid run is N browsers doing real logins against staging. If a slot
      # wedges, the session should die rather than hold the slot forever.
      SE_SESSION_REQUEST_TIMEOUT: 300
      SE_SESSION_RETRY_INTERVAL: 5
      SE_NODE_SESSION_TIMEOUT: 900
    restart: unless-stopped

  # -------------------------------------------------------- chrome slots --
  chrome-1:
    <<: *chrome-node
    container_name: qa-grid-chrome-1
    ports: ["7901:7900"]
    environment:
      <<: *chrome-env
      SE_NODE_GRID_URL: ${GRID_PUBLIC_URL:?set by deploy-grid.sh push}

  chrome-2:
    <<: *chrome-node
    container_name: qa-grid-chrome-2
    ports: ["7902:7900"]
    environment:
      <<: *chrome-env
      SE_NODE_GRID_URL: ${GRID_PUBLIC_URL:?set by deploy-grid.sh push}

  chrome-3:
    <<: *chrome-node
    container_name: qa-grid-chrome-3
    ports: ["7903:7900"]
    environment:
      <<: *chrome-env
      SE_NODE_GRID_URL: ${GRID_PUBLIC_URL:?set by deploy-grid.sh push}

  chrome-4:
    <<: *chrome-node
    container_name: qa-grid-chrome-4
    ports: ["7904:7900"]
    environment:
      <<: *chrome-env
      SE_NODE_GRID_URL: ${GRID_PUBLIC_URL:?set by deploy-grid.sh push}

  # ------------------------------------------------------- android slots --
  # Four slots, four devices, four Android versions. Varying both is the point:
  # the driver app's bugs live in the gap between an OS that grants a permission
  # silently and one that puts a dialog in front of it, and between a 4.95"
  # screen and a 6.1" one. Running the same image four times would cost the same
  # memory and tell you a quarter as much.
  #
  #   slot 1  Samsung Galaxy S10  Android 14   newest of both
  #   slot 2  Samsung Galaxy S9   Android 13
  #   slot 3  Nexus 5             Android 11   small screen, 4.95"
  #   slot 4  Samsung Galaxy S6   Android 9    oldest supported
  #
  # Device names are not free text: the image resolves them against the
  # profiles it ships, which are the six Samsung Galaxy ones plus the Nexus
  # skins (nexus_4, nexus_5, nexus_7, nexus_one, nexus_s). An unknown name
  # falls back to the default rather than failing, so a typo here shows up as
  # a slot quietly running the wrong device.
  #
  # Tags are pinned to v3.9.0-p2 for the same reason the Selenium ones are
  # pinned: a floating `emulator_14.0` is a different image next month, and
  # "the grid changed under us" is not a thing anyone should have to debug.
  #
  # COST: each image is ~10.6GB and these are four different ones, so ~42GB of
  # the host's 96GB disk. Four identical versions would be 10.6GB. That is the
  # price of the coverage above, and it is why the root volume is 100GB.
  #
  # These do not join the Selenium hub. appium-automation already addresses
  # slots by a per-slot appium_url (scripts/stress_parallel_drivers.py), so a
  # hub in front of them would be a layer with nothing to do.

  android-1:
    image: budtmo/docker-android:emulator_14.0_v3.9.0-p2
    container_name: qa-grid-android-1
    privileged: true
    devices: ["/dev/kvm:/dev/kvm"]
    ports:
      - "4723:4723"   # Appium
      - "6081:6080"   # noVNC
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      # swiftshader_indirect, not the image's default of "software".
      # emulator.py:79 falls back to `software`, which rasterises every frame
      # on one host thread -- fine for a settings screen, ruinous for a map
      # that redraws continuously. SwiftShader is still software, but it is
      # multithreaded and JIT-compiled, and it is what the emulator is tuned
      # for on a headless host with no GPU. This is the fix for android-1
      # sitting at ~700% CPU with nothing running.
      EMULATOR_GPU: "swiftshader_indirect"
      # -cores caps the guest at 2 vCPUs so one wedged emulator cannot take
      # seven of the host's sixteen and starve the other three slots.
      # -no-boot-anim and -no-snapshot cut cold-boot time and stop a half
      # written snapshot being restored after a crash.
      EMULATOR_ADDITIONAL_ARGS: "-cores 2 -no-boot-anim -no-snapshot"
      WEB_VNC: "true"
      APPIUM: "true"
      APPIUM_HOST: android-1
    shm_size: 2gb
    # A ceiling the guest cannot talk its way past. -cores is what the emulator
    # agrees to; this is what the kernel enforces. Four slots at 3.0 leaves 4 of
    # the host's 16 cores for Chrome, Appium and the host itself.
    cpus: 3.0
    restart: unless-stopped
    # Asks the DEVICE, not the server. When an emulator dies, supervisord
    # retries it a few times and then gives up for good ("entered FATAL state,
    # too many start retries too quickly") -- while appium, vnc and the rest
    # stay up. So the container is running, the port answers, and Appium's
    # /status still says `ready: true`, because readiness there means the
    # server will accept a connection, not that anything is attached to it.
    # The only outward sign is a noVNC desktop with no phone on it.
    # `docker ps` now says unhealthy instead, which is something a script can
    # see. start_period is generous because a cold emulator boot is ~50-90s and
    # four booting at once are slower.
    healthcheck:
      # Three things, because boot_completed alone said "healthy" through both
      # failures in the CAR-3184 run:
      #   1. booted at all
      #   2. ANSWERING - a trivial shell round trip under a timeout. A pegged
      #      or wedged emulator still reports boot_completed=1 forever; what it
      #      stops doing is replying. This is the check that catches ~700% CPU.
      #   3. no ANR dialog holding focus. hide_error_dialogs should prevent
      #      these, so if one appears the tuner has not run on this slot.
      test: ["CMD-SHELL", "adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1 && timeout 12 adb shell echo ping 2>/dev/null | grep -q ping && ! timeout 12 adb shell dumpsys window 2>/dev/null | grep -i mCurrentFocus | grep -qi 'Application Not Responding'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 300s

  android-2:
    image: budtmo/docker-android:emulator_13.0_v3.9.0-p2
    container_name: qa-grid-android-2
    privileged: true
    devices: ["/dev/kvm:/dev/kvm"]
    ports:
      - "4724:4723"   # Appium
      - "6082:6080"   # noVNC
